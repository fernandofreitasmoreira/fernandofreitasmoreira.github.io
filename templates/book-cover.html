<article class="book-cover">
  <header class="book-cover-header">
    <p class="book-cover-meta">{{author}}{{year_block}}</p>
    <h1 class="book-cover-title">{{title}}</h1>
    {{subtitle_block}}
  </header>

  {{version_banner}}

  {{summary}}

  <section class="book-preface">
    {{preface}}
  </section>

  <section class="book-toc">
    <h2>Sumário</h2>
    <ol class="toc-list">
      {{chapters_list}}
    </ol>
  </section>
</article>
