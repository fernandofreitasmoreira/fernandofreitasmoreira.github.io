<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{canonical}}">
  <link rel="canonical" href="{{canonical}}">
  <link rel="alternate" type="application/atom+xml" title="{{site_title}}" href="/feed.xml">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="site-header">
    <a href="/" class="brand">{{site_title}}</a>
    <nav class="site-nav">
      {{nav}}
      <a href="/about/">Sobre</a>
    </nav>
  </header>
  <main>
    {{content}}
  </main>
  <footer class="site-footer">
    <p>© {{year}} Fernando Moreira · <a href="/feed.xml">Atom</a> · <a href="https://github.com/fernandofreitasmoreira">GitHub</a> · <a href="https://www.linkedin.com/in/fernandofreitasmoreira/">LinkedIn</a></p>
  </footer>
</body>
</html>
