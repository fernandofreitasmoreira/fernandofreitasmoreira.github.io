<article class="post">
  <header class="post-header">
    <p class="meta">
      <a href="/{{section_slug}}/">{{section}}</a>
      ·
      <time datetime="{{date_iso}}">{{date}}</time>
    </p>
    <h1>{{title}}</h1>
    {{summary_block}}
  </header>
  <div class="post-body">
    {{content}}
  </div>
</article>

{{response_block}}
